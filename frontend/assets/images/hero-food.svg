  <circle cx="650" cy="110" r="60" fill="#F59E0B" opacity="0.35"/>
  <rect y="400" width="800" height="200" fill="#8D6E63"/>
  <rect y="390" width="800" height="26" rx="6" fill="#A1887F"/>
  <!-- bread loaf -->
  <path d="M470 330 C470 290 530 280 570 290 C610 300 615 340 600 360 L470 360 Z" fill="#D7A86E"/>
  <path d="M500 300 L505 330 M530 292 L535 330 M560 294 L565 330" stroke="#B9844A" stroke-width="5" stroke-linecap="round"/>
  <!-- apple -->
  <circle cx="650" cy="350" r="42" fill="#E53935"/>
  <path d="M650 308 C652 296 658 290 668 288" stroke="#5D4037" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M658 298 C668 282 684 284 690 290 C680 302 668 302 658 298 Z" fill="#43A047"/>
