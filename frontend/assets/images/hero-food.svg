  <path d="M190 316 L182 308 L196 310 L204 302 L198 318 Z" fill="#2E7D32"/>
  <!-- carrots -->
  <path d="M320 380 L390 350 L398 362 L328 392 Z" fill="#FB8C00"/>
  <path d="M378 352 L372 330 L386 336 L392 318 L398 350 Z" fill="#43A047"/>
  <path d="M100 392 L160 368 L166 380 L106 404 Z" fill="#FB8C00"/>
  <path d="M154 370 L150 348 L162 356 L170 340 L170 368 Z" fill="#43A047"/>
  <!-- leafy greens -->
  <ellipse cx="90" cy="330" rx="42" ry="24" fill="#66BB6A" transform="rotate(-20 90 330)"/>
  <ellipse cx="130" cy="326" rx="40" ry="22" fill="#2E7D32" transform="rotate(15 130 326)"/>
  <ellipse cx="720" cy="330" rx="36" ry="20" fill="#81C784" transform="rotate(25 720 330)"/>
  <!-- amber accent plate -->
  <ellipse cx="400" cy="402" rx="120" ry="14" fill="#F59E0B"/>
